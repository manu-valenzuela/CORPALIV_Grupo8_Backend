spring.application.name=auth
server.port=8081

# Base de datos (las tablas se crean con bd.sql; JPA solo valida que coincidan)
spring.datasource.url=jdbc:mysql://localhost:3306/corpaliv_auth
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# JWT: el mismo secreto en todos los microservicios (mínimo 32 caracteres)
jwt.secreto=corpaliv-clave-secreta-para-firmar-tokens-2026
jwt.expiracion-ms=86400000

# Funcionario inicial
admin.correo=admin@corpaliv.cl
admin.contrasena=admin123
